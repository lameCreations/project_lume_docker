services:
  lume-engine:
    # Points to your Docker Hub image built and pushed by package_release.sh / ps1
    # Docker automatically pulls linux/arm64 on Macs and linux/amd64 on Ubuntu/PCs
    image: lamecreations/project_lume:latest
    container_name: project-lume-core
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "514:514/udp"
      - "514:514/tcp"
      - "1514:1514/udp"
      - "1514:1514/tcp"
    environment:
      - PORT=9000
      - PYTHONUNBUFFERED=1
    extra_hosts:
      # Allows connecting to host services like Ollama (http://host.docker.internal:11434)
      # Essential for Ubuntu/Linux where host.docker.internal is not enabled by default
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent DuckDB database, settings, and incident records
      - ./data_vaults:/app/data_vaults
      # Ingestion Dropzone for PCAP, Syslog, Zeek TSV, EVTX, and CSV drops
      - ./Dropzone_Inputs:/app/dropzone
      # Persistent forensic workspaces and exported case briefs
      - ./web_workspaces:/app/web/workspaces
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/settings/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

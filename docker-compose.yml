services:
  lume-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-lume-core
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "514:514/udp"
      - "514:514/tcp"
      - "1514:1514/udp"
      - "1514:1514/tcp"
    environment:
      - PORT=9000
      - PYTHONUNBUFFERED=1
    extra_hosts:
      # Allows the container to communicate with host services like Ollama (http://host.docker.internal:11434)
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent DuckDB database, SQLite chat history, and configuration files
      - ./data_vaults:/app/data_vaults
      # The Smart Dropzone Mount for automatic ingestion of log and alert files
      - ./Dropzone_Inputs:/app/dropzone
      # Persistent network profile maps and workspace reports
      - ./web/workspaces:/app/web/workspaces
      # Live Wiki mount so documentation updates reflect immediately
      - ./Wiki:/app/Wiki:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/settings/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
